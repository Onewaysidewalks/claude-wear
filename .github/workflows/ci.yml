name: ci

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  bridge:
    name: bridge
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: bridge/package-lock.json
      - run: npm ci
        working-directory: bridge
      - run: npm run lint
        working-directory: bridge
      - run: npm run typecheck
        working-directory: bridge
      - run: npx vitest run --coverage
        working-directory: bridge
      - run: npm run build
        working-directory: bridge

  android:
    name: android
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4

      # Robolectric fetches an android-all jar the first time it runs and puts it here, not
      # in the Gradle caches. Without this the screenshot job re-downloads ~100MB per run.
      - name: Cache Robolectric's android-all jars
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository/org/robolectric
          key: robolectric-${{ runner.os }}-${{ hashFiles('wear/gradle/libs.versions.toml') }}
          restore-keys: robolectric-${{ runner.os }}-

      # verifyRoborazziDebug runs the unit tests with screenshot comparison switched on, so
      # this is one test execution, not two.
      - run: ./gradlew --no-daemon :app:verifyRoborazziDebug :app:lintDebug :app:assembleDebug
        working-directory: wear
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-reports
          path: |
            wear/app/build/reports/
            wear/app/build/outputs/roborazzi/
            wear/app/build/outputs/apk/debug/*.apk
          if-no-files-found: ignore

  contract:
    name: contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: bridge/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4

      # Codegen is a pure function of protocol/schema. If regenerating changes anything,
      # someone edited a generated file or forgot to commit the regeneration.
      - name: Regenerate the protocol
        run: node protocol/codegen/generate.mjs
      - name: Fail if the working tree is dirty
        run: |
          if [[ -n "$(git status --porcelain)" ]]; then
            echo "::error::generated protocol files are stale. Run \`make protocol\` and commit the result."
            git --no-pager diff --stat
            git --no-pager diff
            exit 1
          fi

      - run: npm ci
        working-directory: bridge
      - name: Golden fixtures, TypeScript side
        run: npx vitest run test/protocol-golden.test.ts
        working-directory: bridge
      - name: Golden fixtures, Kotlin side
        run: ./gradlew --no-daemon :protocol:test
        working-directory: wear

  e2e:
    name: e2e
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: bridge/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4

      # KVM is what makes an x86_64 emulator usable on a hosted runner.
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run the E2E loop on a Wear emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: android-wear
          arch: x86_64
          profile: wearos_small_round
          emulator-options: -no-window -no-snapshot -noaudio -no-boot-anim -gpu swiftshader_indirect
          disable-animations: true
          script: ./scripts/e2e.sh

      # Every run, pass or fail: this is what the screens actually looked like on a watch,
      # and it is worth having on a PR that changed one.
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: wear-screenshots
          path: .e2e/shots/
          if-no-files-found: warn

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: e2e-diagnostics
          path: |
            .e2e/
            wear/app/build/reports/androidTests/
          if-no-files-found: ignore
